<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일론 머스크 타임라인 — Elon Musk Timeline</title>
<meta name="description" content="일론 머스크의 생애와 주요 사건을 연도별로 정리한 타임라인 (1971–2026)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #f7f7f8;
  --bg-secondary: #ffffff;
  --bg-card: #ffffff;
  --bg-hover: #f0f0f2;
  --border: #e6e6ea;
  --border-light: #d8d8de;
  --text-primary: #16161a;
  --text-secondary: #5c5c66;
  --text-muted: #9a9aa4;
  --line: #d5d5dc;
  --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 6px 20px rgba(0,0,0,0.04);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.08);
  --radius: 12px;
  --font: 'Inter', 'Noto Sans KR', system-ui, sans-serif;

  --c-early:   #6b7280;
  --c-startup: #7c3aed;
  --c-spacex:  #2563eb;
  --c-tesla:   #dc2626;
  --c-x:       #0f172a;
  --c-ai:      #0891b2;
  --c-politics:#c2410c;
}
[data-theme="dark"] {
  --bg-primary: #0e0e11;
  --bg-secondary: #17171b;
  --bg-card: #1a1a20;
  --bg-hover: #222229;
  --border: #2a2a33;
  --border-light: #34343f;
  --text-primary: #f0f0f3;
  --text-secondary: #a8a8b4;
  --text-muted: #6a6a76;
  --line: #2e2e38;
  --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.25);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.4), 0 12px 32px rgba(0,0,0,0.35);

  --c-early:   #9ca3af;
  --c-startup: #a78bfa;
  --c-spacex:  #60a5fa;
  --c-tesla:   #f87171;
  --c-x:       #cbd5e1;
  --c-ai:      #22d3ee;
  --c-politics:#fb923c;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
  transition: background 0.3s, color 0.3s;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

/* ===== HERO ===== */
.hero {
  padding: 56px 24px 32px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  background:
    radial-gradient(1200px 400px at 50% -120px, rgba(37,99,235,0.10), transparent 70%),
    var(--bg-secondary);
}
.hero-eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 14px;
}
.hero-title {
  font-size: clamp(30px, 6vw, 52px);
  font-weight: 800;
  letter-spacing: -1.5px;
  line-height: 1.05;
}
.hero-sub {
  margin-top: 12px;
  font-size: 15px;
  color: var(--text-secondary);
  font-weight: 400;
}
.hero-stats {
  margin-top: 26px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
}
.stat {
  min-width: 92px;
  padding: 12px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.stat .num { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.stat .lbl { font-size: 11px; color: var(--text-muted); letter-spacing: 0.5px; margin-top: 2px; }

/* ===== CONTROLS ===== */
.controls {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 14px 24px;
  background: color-mix(in srgb, var(--bg-primary) 82%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.filter {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 14px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.18s;
  user-select: none;
}
.filter:hover { background: var(--bg-hover); color: var(--text-primary); }
.filter.active { color: #fff; border-color: transparent; }
.filter .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.filter.active .dot { background: rgba(255,255,255,0.9); }
.filter[data-cat="all"].active   { background: var(--text-primary); color: var(--bg-secondary); }
.filter[data-cat="early"].active   { background: var(--c-early); }
.filter[data-cat="startup"].active { background: var(--c-startup); }
.filter[data-cat="spacex"].active  { background: var(--c-spacex); }
.filter[data-cat="tesla"].active   { background: var(--c-tesla); }
.filter[data-cat="x"].active       { background: var(--c-x); }
.filter[data-cat="ai"].active      { background: var(--c-ai); }
.filter[data-cat="politics"].active{ background: var(--c-politics); }
.theme-btn {
  margin-left: 4px;
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  font-size: 16px;
}

/* ===== TIMELINE ===== */
.timeline {
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 24px 80px;
  position: relative;
}
.timeline::before {
  content: "";
  position: absolute;
  left: 140px;
  top: 40px;
  bottom: 80px;
  width: 2px;
  background: linear-gradient(var(--line), var(--line));
}
.item {
  position: relative;
  display: grid;
  grid-template-columns: 116px 1fr;
  gap: 28px;
  padding: 12px 0;
  transition: opacity 0.3s, transform 0.3s;
}
.item.hidden { display: none; }
.item .year {
  text-align: right;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text-primary);
  padding-top: 14px;
}
.item .year .date { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.3px; margin-top: 2px; }
.item::before {
  content: "";
  position: absolute;
  left: 134px;
  top: 22px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--cat-color);
  border: 3px solid var(--bg-primary);
  box-shadow: 0 0 0 1px var(--cat-color);
  z-index: 2;
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--cat-color);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  transition: transform 0.18s, box-shadow 0.18s;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.card .tag {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--cat-color);
  margin-bottom: 6px;
}
.card h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.card p { margin-top: 6px; font-size: 13.5px; color: var(--text-secondary); }

.footer {
  max-width: 820px;
  margin: 0 auto;
  padding: 0 24px 60px;
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  line-height: 1.9;
}
.footer a { color: var(--text-secondary); }

@media (max-width: 600px) {
  .timeline::before { left: 8px; }
  .item { grid-template-columns: 1fr; gap: 4px; padding-left: 30px; }
  .item .year { text-align: left; padding-top: 0; font-size: 17px; }
  .item .year .date { display: inline; margin-left: 8px; }
  .item::before { left: 2px; top: 6px; }
}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-eyebrow">Biography · Timeline</div>
  <h1 class="hero-title">일론 머스크 타임라인</h1>
  <p class="hero-sub">Elon Reeve Musk — 1971년부터 2026년까지의 주요 여정</p>
  <div class="hero-stats">
    <div class="stat"><div class="num">1971</div><div class="lbl">출생</div></div>
    <div class="stat"><div class="num">55세</div><div class="lbl">2026 기준</div></div>
    <div class="stat"><div class="num" id="stat-count">—</div><div class="lbl">주요 사건</div></div>
    <div class="stat"><div class="num">$850B</div><div class="lbl">순자산 (2026)</div></div>

</div>

<div class="controls" id="controls">

  <button class="filter" data-cat="tesla"><span class="dot" style="color:var(--c-tesla)"></span>Tesla</button>
  <button class="filter" data-cat="x"><span class="dot" style="color:var(--c-x)"></span>X / Twitter</button>
  <button class="filter" data-cat="ai"><span class="dot" style="color:var(--c-ai)"></span>AI · 기타</button>
  <button class="filter" data-cat="politics"><span class="dot" style="color:var(--c-politics)"></span>정치 · DOGE</button>
  <button class="theme-btn" id="themeBtn" title="테마 전환">🌙</button>
</div>

<div class="timeline" id="timeline"></div>

<div class="footer">
  이 타임라인은 공개된 언론 보도와 백과사전 자료를 바탕으로 정리되었습니다. 일부 날짜·수치는 출처에 따라 다를 수 있습니다.<br>
  주요 출처: Wikipedia · Britannica · Statista · Forbes · Reuters · 각종 언론 보도
</div>

const CATCOLOR = {
  early:"var(--c-early)", startup:"var(--c-startup)", spacex:"var(--c-spacex)",
  tesla:"var(--c-tesla)", x:"var(--c-x)", ai:"var(--c-ai)", politics:"var(--c-politics)"
};

const tl = document.getElementById('timeline');
EVENTS.forEach(e => {
  const div = document.createElement('div');
  div.className = 'item';
  div.dataset.cat = e.cat;
  div.style.setProperty('--cat-color', CATCOLOR_get(e.cat));
  div.innerHTML = `
    <div class="year">${e.year}${e.date ? `<span class="date">${e.date}</span>` : ''}</div>
    <div class="card">
      <span class="tag">${e.tag}</span>
      <h3>${e.title}</h3>
      <p>${e.desc}</p>
    </div>`;
  tl.appendChild(div);
});
function CATCOLOR_get(c){ return CATCOLOR[c] || 'var(--text-muted)'; }

document.getElementById('stat-count').textContent = EVENTS.length;

// Filters
document.getElementById('controls').addEventListener('click', ev => {
  const btn = ev.target.closest('.filter');
  if (!btn) return;
  document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const cat = btn.dataset.cat;
  document.querySelectorAll('.item').forEach(it => {
    it.classList.toggle('hidden', cat !== 'all' && it.dataset.cat !== cat);
  });
});

// Theme toggle
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  themeBtn.textContent = dark ? '🌙' : '☀️';
});
</script>
</body>
</html>
